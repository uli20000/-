const fromEl=document.getElementById('from'),toEl=document.getElementById('to'),resultEl=document.getElementById('result'),errorEl=document.getElementById('error'),nearby5=document.getElementById('nearby-5'),nearby9=document.getElementById('nearby-9');
const labels=DATA.shops.map((s,index)=>({...s,index,label:s.shortName}));

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function findShop(value){const v=Number(value);return Number.isInteger(v)&&v>=0&&v<labels.length?labels[v]:null;}
function displayKm(meters){return (Math.ceil(meters/100)/10).toFixed(1);}
function ruleFor(km){if(km<=5)return{label:'調撥工時：30 分鐘',call:false};if(km<=9)return{label:'調撥工時：60 分鐘',call:false};if(km<=13)return{label:'調撥工時：90 分鐘',call:false};if(km<=17)return{label:'調撥工時：120 分鐘',call:false};return{label:'請致電中心溝通',call:true};}
function renderNearby(shop,min,max,el){if(!shop){el.innerHTML='<div class="nearby-empty">尚未選擇餐廳</div>';return;}const items=labels.filter(s=>s.index!==shop.index).map(s=>({shop:s,out:DATA.distances[shop.index][s.index],back:DATA.distances[s.index][shop.index]})).filter(x=>Number.isFinite(x.out)&&Number.isFinite(x.back)).map(x=>({...x,outKm:Number(displayKm(x.out)),backKm:Number(displayKm(x.back))})).map(x=>({...x,basis:Math.max(x.outKm,x.backKm)})).filter(x=>x.basis>min&&x.basis<=max).sort((a,b)=>a.basis-b.basis);el.innerHTML=items.length?items.map(x=>{const rule=ruleFor(x.basis);const label=rule.call?'致電':rule.label.replace('調撥工時：','').replace(' 分鐘','分');return '<div class="nearby-item"><span class="name">'+escapeHtml(x.shop.shortName)+'</span><span class="distance">'+x.outKm.toFixed(1)+' / '+x.backKm.toFixed(1)+' km · '+label+'</span></div>';}).join(''):'<div class="nearby-empty">目前沒有其他餐廳符合此雙向距離範圍。</div>';}function showNearby(shop){renderNearby(shop,0,5,nearby5);renderNearby(shop,5,9,nearby9);}
function calculate(){errorEl.hidden=true;const a=findShop(fromEl.value),b=findShop(toEl.value);showNearby(a);if(!a||!b){resultEl.className='card result empty';resultEl.textContent='請選擇起點與終點餐廳。';if(fromEl.value||toEl.value){errorEl.textContent='請從清單選擇有效的餐廳名稱。';errorEl.hidden=false;}return;}if(a.index===b.index){resultEl.className='card result empty';resultEl.textContent='起點與終點不能是同一間餐廳。';errorEl.textContent='請選擇不同的起點與終點。';errorEl.hidden=false;return;}const meters=DATA.distances[a.index][b.index],reverseMeters=DATA.distances[b.index][a.index];if(!Number.isFinite(meters)||!Number.isFinite(reverseMeters)){resultEl.className='card result';resultEl.innerHTML='<h2>雙向路線資料不完整</h2><p class="route">'+escapeHtml(a.shortName)+' ↔ '+escapeHtml(b.shortName)+'</p><span class="badge call">請致電中心確認</span>';return;}const shown=Number(displayKm(meters)),reverseShown=Number(displayKm(reverseMeters)),basis=Math.max(shown,reverseShown),rule=ruleFor(basis);resultEl.className='card result';resultEl.innerHTML='<h2>'+escapeHtml(rule.label)+'</h2><p class="route">'+escapeHtml(a.shortName)+' → '+escapeHtml(b.shortName)+'</p><span class="badge '+(rule.call?'call':'')+'">本方向導航：'+shown.toFixed(1)+' km</span><p class="reverse">反向導航：'+reverseShown.toFixed(1)+' km</p><p class="rule-note">工時級距依兩方向較高者判定（雙向較高顯示距離 '+basis.toFixed(1)+' km）。</p>';}
fromEl.addEventListener('change',()=>{showNearby(findShop(fromEl.value));if(toEl.value)calculate();});toEl.addEventListener('change',()=>{if(fromEl.value)calculate();});document.getElementById('calculate').addEventListener('click',calculate);document.getElementById('swap').addEventListener('click',()=>{const v=fromEl.value;fromEl.value=toEl.value;toEl.value=v;calculate();});

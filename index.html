      :root {

        --red-dark: #8e0b20;
        --yellow: #f3c400;

      }

      .wrap {

      }
      .hero {
        margin-bottom: 24px;
      }
      .brand {
        display: inline-flex;

        gap: 9px;
        color: var(--red);
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.08em;
      }
      .brand i {
        display: block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--yellow);
        box-shadow: 0 0 0 4px rgba(243, 196, 0, 0.16);
      }
      .hero h1 {
        margin: 15px 0 8px;
        color: var(--red-dark);
        font-size: 42px;
        line-height: 1.2;
        letter-spacing: 0.04em;
        font-weight: 900;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .calculator {
        padding: 26px 28px 24px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 48px 1fr;
        gap: 14px;
        align-items: end;
      }
      .field label {

        margin-bottom: 8px;
        color: var(--red-dark);
        font-size: 18px;
        font-weight: 900;
      }

        width: 100%;
        height: 60px;
        border: 1px solid #d4c7b8;
        border-radius: 10px;
        padding: 0 12px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        text-align: center;
        text-align-last: center;
        outline: none;
        cursor: pointer;
      }
      .field select:focus {
        border-color: var(--red);
        box-shadow: 0 0 0 3px #ffe1e7;
      }
      .swap {
        height: 60px;
        border: 1px solid #e1c76b;
        border-radius: 10px;
        background: #fff8d8;
        color: var(--red);
        font-size: 26px;
        font-weight: 900;
        cursor: pointer;
      }
      .swap:hover {
        background: #ffef9b;
      }
      .actions {
        margin-top: 18px;
      }
      .button {
        height: 48px;
        padding: 0 26px;
        border: 0;
        border-radius: 10px;
        background: var(--red);
        color: #fff;
        font: 900 18px inherit;
        cursor: pointer;
        box-shadow: 0 5px 14px rgba(179, 15, 42, 0.18);
      }
      .button:hover {
        background: var(--red-dark);
      }
      .hint {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .error {
        margin-top: 10px;
        color: var(--red-dark);
        font-size: 14px;
      }
      .result {
        margin-top: 16px;
        padding: 24px;
        min-height: 128px;
      }
      .result.empty {
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .result h2 {
        margin: 0 0 5px;
        color: var(--red-dark);
        font-size: 28px;
        line-height: 1.25;
        font-weight: 900;
      }
      .route {
        margin: 0;
        color: var(--muted);
        font-weight: 700;
      }
      .badge {
        display: inline-block;
        margin-top: 14px;
        padding: 7px 17px;
        border-radius: 999px;
        background: var(--soft-red);
        color: var(--red);
        font-weight: 900;
        font-size: 17px;
      }
      .badge.call {
        background: #fff0df;
        color: #9a5a17;
      }
      .addresses {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 18px;
      }
      .address {
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .nearby {
        margin-top: 16px;
        padding: 22px 24px;
      }
      .nearby h2 {
        margin: 0;
        color: var(--red-dark);
        font-size: 24px;
        font-weight: 900;
      }
      .nearby-sub {
        margin: 4px 0 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .nearby-list {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        text-align: left;
      }
      .nearby-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font-size: 16px;
      }
      .nearby-item .name {
        font-weight: 800;
      }
      .nearby-item .distance {
        color: var(--red);
        font-weight: 900;
        white-space: nowrap;
      }
      .nearby-empty {
        color: var(--muted);
        font-size: 16px;
        padding: 6px;
        font-weight: 700;
      }
      .foot {
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 700px) {
        .wrap {
          padding: 30px 16px 44px;
        }
        .hero h1 {
          font-size: 30px;
        }
        .calculator {
          padding: 22px 18px;
        }
        .form-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .swap {
          width: 100%;
          height: 40px;
        }
        .button {
          width: 100%;
        }
        .addresses,
        .nearby-list {
          grid-template-columns: 1fr;
        }
        .result,
        .nearby {
          padding: 20px;
        }
      }

        nearby5 = document.getElementById("nearby-5"),
        nearby9 = document.getElementById("nearby-9");
      const labels = DATA.shops.map((s, index) => ({
        ...s,
        index,
        label: s.shortName,
      }));

      function escapeHtml(v) {
        return String(v).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function findShop(value) {
        const v = Number(value);
        return Number.isInteger(v) && v >= 0 && v < labels.length
          ? labels[v]
          : null;
      }
      function ruleFor(km) {
        if (km <= 5)
          return {
            label: "調撥工時：30 分鐘",
            call: false,
            note: "距離 5 公里內，調撥工時為 30 分鐘。",
          };
        if (km <= 9)
          return {
            label: "調撥工時：60 分鐘",
            call: false,
            note: "距離超過 5 公里且不超過 9 公里，調撥工時為 60 分鐘。",
          };
        if (km <= 13)
          return {
            label: "調撥工時：90 分鐘",
            call: false,
            note: "距離超過 9 公里且不超過 13 公里，調撥工時為 90 分鐘。",
          };
        if (km <= 17)
          return {
            label: "調撥工時：120 分鐘",
            call: false,
            note: "距離超過 13 公里且不超過 17 公里，調撥工時為 120 分鐘。",
          };
        return {
          label: "請致電中心溝通",
          call: true,
          note: "距離超過 17 公里，請致電中心溝通調撥安排。",
        };
      }
      function renderNearby(shop, min, max, el) {
        if (!shop) {
          el.innerHTML = '<div class="nearby-empty">尚未選擇餐廳</div>';
          return;
        }
        const items = labels
          .filter((s) => s.index !== shop.index)
          .map((s) => ({
            shop: s,
            km: DATA.distances[shop.index][s.index] / 1000,
          }))
          .filter((x) => x.km > min && x.km <= max)
          .sort((a, b) => a.km - b.km);
        const range = min === 0 ? max + " 公里內" : "6～" + max + " 公里";
        el.innerHTML = items.length
          ? items
              .map(
                (x) =>
                  '<div class="nearby-item"><span class="name">' +
                  escapeHtml(x.shop.shortName) +
                  '</span><span class="distance">' +
                  x.km.toFixed(1) +
                  " km</span></div>",
              )
              .join("")
          : '<div class="nearby-empty">目前沒有其他餐廳在 ' +
            range +
            "。</div>";
      }
      function showNearby(shop) {
        renderNearby(shop, 0, 5, nearby5);
        renderNearby(shop, 5, 9, nearby9);
      }
      function calculate() {
        errorEl.hidden = true;
        const a = findShop(fromEl.value),
          b = findShop(toEl.value);
        showNearby(a);
        if (!a || !b) {
          resultEl.className = "card result empty";
          resultEl.textContent = "請選擇起點與終點餐廳。";
          if (fromEl.value || toEl.value) {
            errorEl.textContent = "請從清單選擇有效的餐廳名稱。";
            errorEl.hidden = false;
          }
          return;
        }
        if (a.index === b.index) {
          resultEl.className = "card result empty";
          resultEl.textContent = "起點與終點不能是同一間餐廳。";
          errorEl.textContent = "請選擇不同的起點與終點。";
          errorEl.hidden = false;
          return;
        }
        const km = DATA.distances[a.index][b.index] / 1000,
          rule = ruleFor(km);
        resultEl.className = "card result";
        resultEl.innerHTML =
          "<h2>" +
          escapeHtml(rule.label) +
          '</h2><p class="route">' +
          escapeHtml(a.shortName) +
          " → " +
          escapeHtml(b.shortName) +
          '</p><span class="badge ' +
          (rule.call ? "call" : "") +
          '">' +
          km.toFixed(1) +
          " km</span>";
      }
      fromEl.addEventListener("change", () => {
        showNearby(findShop(fromEl.value));
        if (toEl.value) calculate();
      });
      toEl.addEventListener("change", () => {
        if (fromEl.value) calculate();
      });
      document.getElementById("calculate").addEventListener("click", calculate);
      document.getElementById("swap").addEventListener("click", () => {
        const v = fromEl.value;
        fromEl.value = toEl.value;
        toEl.value = v;
        calculate();
      });

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function findShop(value){const v=Number(value);return Number.isInteger(v)&&v>=0&&v<labels.length?labels[v]:null;}
function ruleFor(km){if(km<=5)return{label:'調撥工時：30 分鐘',call:false,note:'距離 5 公里內，調撥工時為 30 分鐘。'};if(km<=9)return{label:'調撥工時：60 分鐘',call:false,note:'距離超過 5 公里且不超過 9 公里，調撥工時為 60 分鐘。'};if(km<=13)return{label:'調撥工時：90 分鐘',call:false,note:'距離超過 9 公里且不超過 13 公里，調撥工時為 90 分鐘。'};if(km<=17)return{label:'調撥工時：120 分鐘',call:false,note:'距離超過 13 公里且不超過 17 公里，調撥工時為 120 分鐘。'};return{label:'請致電中心溝通',call:true,note:'距離超過 17 公里，請致電中心溝通調撥安排。'};}
function showNearby(shop){if(!shop){nearbyList.innerHTML='<div class="nearby-empty">尚未選擇餐廳</div>';return;}const items=labels.filter(s=>s.index!==shop.index).map(s=>({shop:s,km:DATA.distances[shop.index][s.index]/1000})).filter(x=>x.km<=5).sort((a,b)=>a.km-b.km);nearbyList.innerHTML=items.length?items.map(x=>'<div class="nearby-item"><span class="name">'+escapeHtml(x.shop.shortName)+'</span><span class="distance">'+x.km.toFixed(1)+' km</span></div>').join(''):'<div class="nearby-empty">目前沒有其他餐廳在 5 公里內。</div>';}
function calculate(){errorEl.hidden=true;const a=findShop(fromEl.value),b=findShop(toEl.value);showNearby(a);if(!a||!b){resultEl.className='card result empty';resultEl.textContent='請選擇起點與終點餐廳。';if(fromEl.value||toEl.value){errorEl.textContent='請從清單選擇有效的餐廳名稱。';errorEl.hidden=false;}return;}if(a.index===b.index){resultEl.className='card result empty';resultEl.textContent='起點與終點不能是同一間餐廳。';errorEl.textContent='請選擇不同的起點與終點。';errorEl.hidden=false;return;}const km=DATA.distances[a.index][b.index]/1000,rule=ruleFor(km);resultEl.className='card result';resultEl.innerHTML='<h2>'+escapeHtml(rule.label)+'</h2><p class="route">'+escapeHtml(a.shortName)+' → '+escapeHtml(b.shortName)+'</p><span class="badge '+(rule.call?'call':'')+'">'+km.toFixed(1)+' km</span>';}
fromEl.addEventListener('change',()=>{showNearby(findShop(fromEl.value));if(toEl.value)calculate();});toEl.addEventListener('change',()=>{if(fromEl.value)calculate();});document.getElementById('calculate').addEventListener('click',calculate);document.getElementById('swap').addEventListener('click',()=>{const v=fromEl.value;fromEl.value=toEl.value;toEl.value=v;calculate();});

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肯德基餐廳調撥工時查詢</title>
<style>
:root{--max:520px;--red:#c8102e;--red-dark:#9b0e2c;--ink:#241d1e;--muted:#62585b;--line:#e5deda;--paper:#fff;--wash:#f4f0eb;--shadow:0 2px 5px #2f13200a,0 8px 20px #3d232015;font:14px/1.36 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","微軟正黑體","Noto Sans TC",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--wash);position:relative;isolation:isolate}
body::before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:151px;background:linear-gradient(135deg,transparent 72%,#f8455e2e 72% 75%,transparent 75% 78%,#f8455e2e 78% 81%,transparent 81%),linear-gradient(130deg,#a80b26,#cb0e30 66%,#b7082a)}
h1,h2,h3,p{margin:0}
h1,h2,h3,label,button,p,.brand,.route,.km,.shop-name,.nearby-item,.distance-pair,.sum-box,.duty-status,.guest-status{white-space:nowrap}
button,input{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #0070ac;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{width:min(100%,var(--max));margin-inline:auto;padding:12px 12px 24px;display:grid;gap:10px}
.hero{text-align:center;padding:1px 0 3px;color:#fff}
.brand{display:flex;justify-content:center;align-items:center;gap:6px;min-height:22px;font-size:11px;font-weight:750;color:#ffeef1}
.brand b{font:italic 900 17px/1 Arial,sans-serif;letter-spacing:-.085em}
.brand i{width:13px;height:10px;background:linear-gradient(90deg,currentColor 0 3px,transparent 3px 5px,currentColor 5px 8px,transparent 8px 10px,currentColor 10px)}
.hero h1{font-size:clamp(25px,7.2vw,31px);line-height:1.2;font-weight:850;letter-spacing:.035em}
.hero p{margin-top:4px;font-size:11px;color:#ffeef1}
.card{min-width:0;background:var(--paper);border:1px solid #e7ded8;border-radius:18px;box-shadow:var(--shadow);text-align:center}
.calculator{padding:10px 12px;border-color:#fff}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);align-items:center;gap:8px}
.field{display:grid;gap:3px;min-width:0}
.field label{color:var(--muted);font-weight:750;font-size:12px}
.field input{width:100%;height:38px;padding:0 5px;border:1px solid #eadedc;border-radius:10px;background:#f8f3ef;color:var(--ink);text-align:center;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.045em;outline:none}
.field input::placeholder{color:#8a8085;font-size:13px;font-weight:600;letter-spacing:0}
.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ffe1e7}.field input.bad{border-color:var(--red)}
.shop-name{min-height:16px;font-size:12px;font-weight:740;color:var(--muted);overflow:hidden;text-overflow:ellipsis}.shop-name.ok{color:#4c383b}.shop-name.bad{color:var(--red)}
.swap{display:grid;place-items:center;width:34px;height:34px;padding:0;border:0;border-radius:10px;background:#272124;color:#fff;font-size:19px;font-weight:800;line-height:1}
.result{padding:10px 12px 11px}
.result.empty{padding-block:11px;color:#6d1d30;font-size:13px;font-weight:750}
.result-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,114px);align-items:center;gap:9px}
.result-trip{min-width:0}
.route{font-weight:790;overflow:hidden;text-overflow:ellipsis}
.result-trip .route{font-size:clamp(13px,3.9vw,17px)}
.distance-pair{display:flex;justify-content:center;gap:6px;margin-top:5px;font-size:11px}
.distance-pair span{display:grid;min-width:0;padding:4px 7px;border-radius:7px;background:#f5efeb;color:#5a4649}
.distance-pair b{font-size:12px;font-weight:780;font-variant-numeric:tabular-nums}
.distance-pair .call{background:#ffedcf;color:#743800}
.result-time{min-height:67px;display:grid;align-content:center;padding:4px 2px 5px;border-radius:13px;background:#fce4e9;color:var(--red-dark)}
.result-time h2{font-size:11px;font-weight:750}
.result-number{display:inline-block;font-variant-numeric:tabular-nums;font-weight:860;font-size:40px;line-height:.98;letter-spacing:-.065em}
.result-unit{margin-left:3px;font-size:12px;font-weight:750}
.result-call{margin:5px 0 2px;font-size:20px;font-weight:850;line-height:1.3}
.result.call .result-time{background:#ffedcf;color:#743800}
.add-row{margin-top:8px}.add-msg{margin-top:5px;font-size:12px;color:var(--muted)}.add-msg:empty{display:none}
.button{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:38px;padding:0 6px;border:1px solid transparent;border-radius:10px;background:var(--red);color:#fff;font-weight:750;line-height:1.15}
.button:hover{background:var(--red-dark)}.button:disabled{opacity:.5;cursor:default}
.button.ghost{background:var(--paper);border-color:var(--line);color:var(--ink)}.button.ghost:hover{background:#fff0f2}
.button.small{font-size:12px}
.add-row .button{width:100%;font-size:15px}
.nearby{min-width:0;text-align:center;padding:5px 7px 6px;border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.nearby h2{margin-bottom:3px;font-size:13px;font-weight:800;color:#543b40}
.nearby-list{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.nearby-item{flex:0 0 calc((100% - 8px)/3);display:grid;align-content:center;justify-items:center;gap:1px;min-width:0;min-height:37px;padding:3px;border-radius:8px;background:#faf6f3;font-size:clamp(11px,3.35vw,13px)}
.nearby-item .name{font-weight:760;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nearby-item .distance{padding:0 7px;border-radius:99px;font-size:11px;font-weight:750;background:#fae6ea;color:#96102b}
.nearby-60 .distance{background:#eee9e3;color:#5c4546}
.nearby-empty{flex:1 0 100%;padding:5px;color:var(--muted);font-size:12px}
.log{padding:0 10px 10px}
.log-heading{margin-inline:-10px;padding:10px 10px 8px;border-radius:18px 18px 0 0;background:#261e21;color:#fff}
.log-title-row{display:grid;justify-items:center;gap:1px;margin-bottom:7px}
.log h2{font-size:18px;font-weight:850}
.log-date{font-size:11px;font-variant-numeric:tabular-nums;color:#e4d3d7}
.log-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.sum-box{display:grid;align-content:center;min-height:45px;padding:3px 2px}
.sum-box+.sum-box{border-left:1px solid #ffffff38}
.sum-label{font-size:11px;font-weight:750}
.sum-value{font-variant-numeric:tabular-nums;font-size:11px;font-weight:740}
.sum-value b{font-size:24px;line-height:1;letter-spacing:-.05em;font-weight:860}
.sum-box:nth-child(2) .sum-value{color:#ff9fb3}.sum-box:nth-child(3){color:#ffcc88}
.log-list{display:grid;padding-top:2px}
.log-item{display:grid;grid-template-columns:minmax(0,1fr) 67px 38px;align-items:center;gap:5px;min-height:48px;padding:4px 5px;border-bottom:1px solid #eee7e1}
.log-item .route{font-size:clamp(12px,3.5vw,14px)}
.log-item .km{display:flex;justify-content:center;margin-top:2px;color:var(--muted);font-size:clamp(9px,2.85vw,12px);font-variant-numeric:tabular-nums;font-weight:620}
.km>span+span{margin-left:4px;padding-left:4px;border-left:1px solid var(--line)}
.mins{display:grid;align-content:center;min-height:33px;border-radius:7px;font-size:12px;font-weight:800;white-space:nowrap;background:#f8e4e8;color:#970f2b}
.mins.call{background:#ffebca;color:#733902}
.del{height:32px;padding:0 2px;border:1px solid #edd1d7;border-radius:8px;background:var(--paper);color:#ac1832;font-size:11px;font-weight:750}
.del:hover{background:#fff0f2}
body[data-duty="guest"] .log-item{grid-template-columns:minmax(0,1fr) 67px}
.log-empty{padding:12px 6px;color:var(--muted);font-size:13px;border-bottom:1px solid #eee7e1}
.log-actions,.duty,.modal-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.log-actions{margin-top:7px}
.log-actions #copy{border-color:var(--red);color:#fff;background:var(--red)}.log-actions #copy:hover{background:var(--red-dark)}
.log-msg{margin-top:5px;font-size:12px;color:var(--muted)}.log-msg:empty{display:none}
.duty{grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
body[data-duty="guest"] .duty{grid-template-columns:repeat(2,minmax(0,1fr))}
.duty .button{min-height:34px}
.duty-status{display:flex;align-items:center;justify-content:center;gap:4px;min-height:34px;border-radius:8px;background:#e9f5ee;color:#216342;font-size:11px;font-weight:760}
.duty-status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.guest-status{color:var(--muted);font-size:11px;font-weight:750}
.modal{position:fixed;inset:0;background:#191520a3;display:grid;place-items:center;padding:16px;z-index:10}
.modal-box{width:min(360px,100%);padding:16px;border-top:5px solid var(--red);border-radius:20px;box-shadow:0 18px 50px #100a1647}
.modal-box h3{font-size:19px;font-weight:850}
.modal-box p{margin:4px 0 12px;color:var(--muted);font-size:12px;white-space:normal}
.modal-fields{display:grid;gap:6px}
.modal-fields input{width:100%;min-height:41px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:var(--wash);color:var(--ink);text-align:center;font-size:16px;outline:none}
.modal-fields input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ffe1e7}
.modal-fields input::placeholder{font-size:13px;color:var(--muted)}
.modal-err{min-height:18px;margin-top:6px;color:var(--red);font-size:12px}
.modal-actions{margin-top:8px}
@media(max-width:420px){body::before{height:139px}.wrap{gap:8px;padding-block:10px 12px}.brand{min-height:20px}.hero{padding:0 0 2px}.hero p{margin-top:3px}.calculator{padding-block:7px}.field{gap:2px}.field input{height:36px}.result{padding-block:8px}.result-number{font-size:38px}.distance-pair{margin-top:3px}.distance-pair span{padding-block:3px}.add-row{margin-top:7px}.nearby-item{min-height:36px}.log-heading{padding-block:8px 7px}.log-title-row{margin-bottom:5px}.log h2{font-size:17px}.sum-box{min-height:44px}.log-item{min-height:45px}}
</style></head><body data-duty="guest"><main class="wrap">
<header class="hero"><div class="brand"><i aria-hidden="true"></i><b>KFC</b><span>肯德基餐廳</span></div><h1>調撥工時查詢</h1><p>機車導航距離｜去回取較遠值</p></header>

<section class="card calculator" aria-labelledby="calc-title"><h2 id="calc-title" class="sr-only">輸入店號</h2>
<div class="form-grid">
<div class="field"><label for="from">起點店號</label><input id="from" inputmode="numeric" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="如 098"><div id="from-name" class="shop-name">&nbsp;</div></div>
<button class="swap" type="button" id="swap" aria-label="交換起點與終點">⇄</button>
<div class="field"><label for="to">終點店號</label><input id="to" inputmode="numeric" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="如 165"><div id="to-name" class="shop-name">&nbsp;</div></div>
</div>
</section>

<section id="result" class="card result empty" aria-live="polite">輸入起點與終點店號即可查詢</section>

<section class="nearby nearby-30" aria-live="polite"><h2>1-5KM（30分鐘）</h2><div id="nearby-5" class="nearby-list"><div class="nearby-empty">尚未輸入起點店號</div></div></section>
<section class="nearby nearby-60" aria-live="polite"><h2>5-9KM（60分鐘）</h2><div id="nearby-9" class="nearby-list"><div class="nearby-empty">尚未輸入起點店號</div></div></section>

<section class="card log" aria-labelledby="log-title">
<div class="log-heading">
<div class="log-title-row"><h2 id="log-title">今日調撥紀錄</h2><p class="log-date" id="log-date"></p></div>
<div class="log-sum">
<div class="sum-box"><span class="sum-label">筆數</span><span class="sum-value"><b id="sum-count">—</b> 筆</span></div>
<div class="sum-box"><span class="sum-label">合計工時</span><span class="sum-value"><b id="sum-mins">—</b> 分鐘</span></div>
<div class="sum-box"><span class="sum-label">致電中心</span><span class="sum-value">另 <b id="sum-call">—</b> 筆</span></div>
</div>
</div>
<div id="log-list" class="log-list"><div class="log-empty">讀取中…</div></div>
<div class="log-actions"><button class="button ghost small" type="button" id="copy">複製今日匯總</button><button class="button ghost small" type="button" id="reload">重新整理</button></div>
<div id="log-msg" class="log-msg" aria-live="polite"></div>
<div class="duty" id="duty"></div>
</section>
</main>

<div class="modal" id="modal" hidden><div class="card modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
<h3 id="modal-title">值班登入</h3><p id="modal-desc"></p>
<div class="modal-fields">
<input type="password" id="pw" autocomplete="current-password" placeholder="值班密碼">
<input type="password" id="pw-new" autocomplete="new-password" placeholder="新密碼（至少 4 個字）">
<input type="password" id="pw-new2" autocomplete="new-password" placeholder="再輸入一次新密碼">
</div>
<div class="modal-err" id="pw-err"></div>
<div class="modal-actions"><button class="button ghost" type="button" id="pw-cancel">取消</button><button class="button" type="button" id="pw-ok">登入</button></div>
</div></div>

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function displayKm(m){return Math.ceil(m/100)/10;}

function shortName(n){return n.replace(/餐廳$/,'');}
function findByCode(raw){
  const v=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!v)return {state:'empty'};
  let hit=null;
  if(/^\d{1,3}$/.test(v)){const n=v.padStart(3,'0');hit=shops.find(s=>s.code.slice(3)===n);}
  else if(/^TW[A-Z]\d{3}$/.test(v)){hit=shops.find(s=>s.code===v);}
  return hit?{state:'ok',shop:hit}:{state:'bad'};
}
function showName(inputEl,nameEl,r){

function trip(a,b){const out=displayKm(DATA.distances[a.index][b.index]),back=displayKm(DATA.distances[b.index][a.index]);const basis=Math.max(out,back);return {out,back,basis,minutes:ruleFor(basis)};}

function renderNearby(shop,min,max,el){

  const items=shops.filter(s=>s.index!==shop.index).map(s=>({s,...trip(shop,s)})).filter(x=>x.basis>min&&x.basis<=max).sort((a,b)=>a.basis-b.basis);

  res.innerHTML='<div class="result-grid"><div class="result-trip">'
   +'<p class="route">'+esc(shortName(a.shortName))+' → '+esc(shortName(b.shortName))+'</p>'
   +'<div class="distance-pair"><span class="'+(t.out>17?'call':'')+'">本方向 <b>'+t.out.toFixed(1)+' km</b></span><span class="'+(t.back>17?'call':'')+'">反向 <b>'+t.back.toFixed(1)+' km</b></span></div></div>'
   +'<div class="result-time"><h2>調撥工時</h2>'+(call?'<p class="result-call">致電中心</p>':'<p><b class="result-number">'+t.minutes+'</b><span class="result-unit">分鐘</span></p>')+'</div></div>'
   +'<div class="add-row"><button class="button" type="button" id="add"><span aria-hidden="true">＋</span>加入今日紀錄</button><div class="add-msg" id="add-msg"></div></div>';
  $('add').addEventListener('click',addLog);
}

/* ---- 紀錄 ---- */
function taipeiToday(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());}
function taipeiTime(iso){return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));}
function getPw(){try{return localStorage.getItem(PW_KEY)||'';}catch(e){return '';}}
function setPw(v){try{v?localStorage.setItem(PW_KEY,v):localStorage.removeItem(PW_KEY);}catch(e){}}
async function rpc(name,body){
  const r=await fetch(API_URL+name,{method:'POST',headers:{'apikey':API_KEY,'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await r.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){}
  if(!r.ok){const msg=(data&&(data.message||data.hint))||text||('HTTP '+r.status);const err=new Error(msg);err.bad=/BAD_PASSWORD/.test(msg);err.missing=r.status===404;throw err;}
  return data;
}
function renderDuty(){
  let h;const staff=!!getPw()&&hasPw!==false;
  if(hasPw===false)h='<span class="guest-status">尚未設定值班密碼</span><button class="button small" type="button" id="setup">設定密碼</button>';
  else if(staff)h='<span class="duty-status">值班已登入</span><button class="button ghost small" type="button" id="change">更改密碼</button><button class="button ghost small" type="button" id="logout">登出</button>';
  else h='<span class="guest-status">新增刪除需值班登入</span><button class="button small" type="button" id="login">值班登入</button>';
  document.body.dataset.duty=staff?'staff':'guest';
  $('duty').innerHTML=h;
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  on('logout',()=>{setPw('');renderDuty();renderLogs();});
  on('login',()=>openModal(null,'login'));
  on('setup',()=>openModal(null,'setup'));
  on('change',()=>openModal(null,'change'));
}
async function loadHasPw(){try{hasPw=await rpc('t995_transfer_has_password',{});}catch(e){hasPw=null;}renderDuty();}

function renderLogs(){
  const total=logs.reduce((s,l)=>s+(l.minutes||0),0),calls=logs.filter(l=>l.minutes==null).length;
  $('sum-count').textContent=logs.length;
  $('sum-mins').textContent=total;$('sum-call').textContent=calls;
  const canDel=!!getPw();
  $('log-list').innerHTML=logs.length?logs.map(l=>'<div class="log-item"><div><p class="route">'+esc(shortName(l.from_name))+' → '+esc(shortName(l.to_name))+'</p><p class="km"><span>'+taipeiTime(l.created_at)+'</span><span>'+esc(l.from_code.slice(3))+' → '+esc(l.to_code.slice(3))+'</span><span>'+Number(l.out_km).toFixed(1)+' / '+Number(l.back_km).toFixed(1)+' km</span></p></div><span class="mins'+(l.minutes==null?' call':'')+'">'+(l.minutes==null?'致電中心':l.minutes+' 分鐘')+'</span>'+(canDel?'<button class="del" type="button" data-id="'+esc(l.id)+'">刪除</button>':'')+'</div>').join(''):'<div class="log-empty">今天還沒有調撥紀錄</div>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>delLog(b.dataset.id));
}
async function loadLogs(){
  const d=taipeiToday();const [y,m,dd]=d.split('-');
  $('log-date').textContent=y+'/'+Number(m)+'/'+Number(dd)+'・台灣時間・紀錄保留 7 天';
  try{logs=await rpc('t995_transfer_list',{p_date:d})||[];$('log-msg').textContent='';renderLogs();}
  catch(e){logs=[];renderLogs();$('log-list').innerHTML='<div class="log-empty">'+(e.missing?'紀錄功能尚未啟用':'讀取失敗，請稍後再試')+'</div>';$('sum-count').textContent='—';$('sum-mins').textContent='—';$('sum-call').textContent='—';}
}
const MODAL={
  login:{title:'值班登入',desc:'新增、刪除紀錄需要值班密碼。<br>這台裝置會記住，下次不用再輸入。',ok:'登入',old:true,nw:false},
  setup:{title:'設定值班密碼',desc:'第一次使用，請設定值班密碼。<br>之後新增、刪除紀錄都要用這組密碼。',ok:'設定',old:false,nw:true},
  change:{title:'更改值班密碼',desc:'請輸入目前的密碼和新密碼。<br>改完後其他裝置要重新登入。',ok:'更改',old:true,nw:true}
};
function openModal(action,mode){
  if(!mode)mode=hasPw===false?'setup':'login';
  pendingAction=action;modalMode=mode;const m=MODAL[mode];
  $('modal-title').textContent=m.title;$('modal-desc').innerHTML=m.desc;$('pw-ok').textContent=m.ok;
  $('pw').hidden=!m.old;$('pw').placeholder=mode==='change'?'目前的密碼':'值班密碼';
  $('pw-new').hidden=!m.nw;$('pw-new2').hidden=!m.nw;
  ['pw','pw-new','pw-new2'].forEach(id=>$(id).value='');$('pw-err').textContent='';
  $('modal').hidden=false;setTimeout(()=>$(m.old?'pw':'pw-new').focus(),30);
}
function closeModal(){$('modal').hidden=true;pendingAction=null;}
async function submitPw(){
  const mode=modalMode,m=MODAL[mode],v=$('pw').value.trim(),n1=$('pw-new').value.trim(),n2=$('pw-new2').value.trim();
  if(m.old&&!v){$('pw-err').textContent='請輸入密碼';return;}
  if(m.nw){if(n1.length<4){$('pw-err').textContent='新密碼至少 4 個字';return;}if(n1!==n2){$('pw-err').textContent='兩次輸入的新密碼不一樣';return;}}
  $('pw-ok').disabled=true;$('pw-err').textContent='確認中…';
  try{
    let finalPw=v;
    if(m.nw){await rpc('t995_transfer_set_password',{p_old:v||null,p_new:n1});finalPw=n1;hasPw=true;}
    else{const ok=await rpc('t995_transfer_check',{p_password:v});if(!ok){$('pw-err').textContent='密碼不正確';return;}}
    setPw(finalPw);const act=pendingAction;closeModal();renderDuty();renderLogs();
    $('log-msg').textContent=mode==='setup'?'值班密碼已設定':mode==='change'?'值班密碼已更改':'';
    if(act)act();
  }catch(e){$('pw-err').textContent=e.bad?(mode==='setup'?'密碼已有人設定，請改用值班登入':'目前的密碼不正確'):e.missing?'紀錄功能尚未啟用':'連線失敗，請稍後再試';if(e.bad&&mode==='setup'){hasPw=true;renderDuty();}}
  finally{$('pw-ok').disabled=false;}
}
async function addLog(){
  if(!current)return;const c=current,msg=$('add-msg');
  if(!getPw()){openModal(addLog);return;}
  $('add').disabled=true;msg.textContent='新增中…';
  try{await rpc('t995_transfer_add',{p_password:getPw(),p_from_code:c.a.code,p_from_name:c.a.shortName,p_to_code:c.b.code,p_to_name:c.b.shortName,p_out_km:c.out,p_back_km:c.back,p_minutes:c.minutes});
    msg.textContent='已加入：'+shortName(c.a.shortName)+' → '+shortName(c.b.shortName);await loadLogs();}
  catch(e){if(e.bad){setPw('');renderDuty();msg.textContent='值班密碼已變更，請重新登入';openModal(addLog,'login');}else msg.textContent=e.missing?'紀錄功能尚未啟用':'新增失敗，請稍後再試';}
  finally{const b=$('add');if(b)b.disabled=false;}
}
async function delLog(id){
  const l=logs.find(x=>x.id===id);if(!l)return;
  if(!confirm('確定刪除這筆紀錄？\n'+taipeiTime(l.created_at)+'　'+shortName(l.from_name)+' → '+shortName(l.to_name)))return;
  try{await rpc('t995_transfer_delete',{p_password:getPw(),p_id:id});await loadLogs();$('log-msg').textContent='已刪除';}
  catch(e){if(e.bad){setPw('');renderDuty();renderLogs();$('log-msg').textContent='值班密碼已變更，請重新登入';}else $('log-msg').textContent='刪除失敗，請稍後再試';}
}
function summaryText(){
  const d=taipeiToday().split('-');const total=logs.reduce((s,l)=>s+(l.minutes||0),0),calls=logs.filter(l=>l.minutes==null).length;
  const head=Number(d[1])+'/'+Number(d[2])+' 調撥匯總（共 '+logs.length+' 筆，合計 '+total+' 分鐘'+(calls?'，另 '+calls+' 筆致電中心':'')+'）';
  return [head].concat(logs.map((l,i)=>(i+1)+'. '+taipeiTime(l.created_at)+' '+shortName(l.from_name)+' → '+shortName(l.to_name)+'｜'+minsText(l.minutes))).join('\n');
}
async function copySummary(){
  if(!logs.length){$('log-msg').textContent='今天還沒有紀錄可以複製';return;}
  const t=summaryText();
  try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  $('log-msg').textContent='已複製，可以貼到 LINE';
}

$('from').addEventListener('input',update);$('to').addEventListener('input',update);
$('swap').addEventListener('click',()=>{const v=$('from').value;$('from').value=$('to').value;$('to').value=v;update();});
$('copy').addEventListener('click',copySummary);$('reload').addEventListener('click',loadLogs);
$('pw-ok').addEventListener('click',submitPw);$('pw-cancel').addEventListener('click',closeModal);
['pw','pw-new','pw-new2'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submitPw();}));
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});
renderDuty();update();loadLogs();loadHasPw();
</script></body></html>

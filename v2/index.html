<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>肯德基餐廳調撥工時查詢</title>
<style>
:root{--paper:#fffdf9;--cream:#f6f0e6;--ink:#292521;--muted:#7b7168;--red:#b30f2a;--red-dark:#8e0b20;--yellow:#f3c400;--line:#e8ddce;--soft:#faf6ef;--soft-red:#fff0f2;--shadow:0 10px 30px rgba(78,49,20,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"Microsoft JhengHei","微軟正黑體","Noto Sans TC",Arial,sans-serif;font-size:18px;line-height:1.5;font-weight:700}
.wrap{max-width:820px;margin:0 auto;padding:42px 24px 56px;text-align:center}
.hero{margin-bottom:24px}.brand{display:inline-flex;align-items:center;gap:9px;color:var(--red);font-size:14px;font-weight:900;letter-spacing:.08em}.brand i{display:block;width:10px;height:10px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 4px rgba(243,196,0,.16)}
.hero h1{margin:15px 0 8px;color:var(--red-dark);font-size:42px;line-height:1.2;letter-spacing:.04em;font-weight:900;white-space:nowrap}.hero p{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.calculator{padding:26px 28px 24px}.form-grid{display:grid;grid-template-columns:1fr 48px 1fr;gap:14px;align-items:start}
.field label{display:block;margin-bottom:8px;color:var(--red-dark);font-size:18px;font-weight:900}
.field input{width:100%;height:60px;border:1px solid #d4c7b8;border-radius:10px;padding:0 12px;background:#fff;color:var(--ink);font:inherit;font-size:24px;letter-spacing:.06em;text-align:center;outline:none}
.field input::placeholder{color:#b8aca0;font-size:17px;letter-spacing:0}
.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ffe1e7}.field input.bad{border-color:var(--red)}
.shop-name{min-height:24px;margin-top:6px;font-size:15px;color:var(--muted)}.shop-name.ok{color:var(--ink)}.shop-name.bad{color:var(--red)}
.swap{height:60px;margin-top:35px;border:1px solid #e1c76b;border-radius:10px;background:#fff8d8;color:var(--red);font-size:26px;font-weight:900;cursor:pointer}.swap:hover{background:#ffef9b}
.hint{margin:12px 0 0;color:var(--muted);font-size:13px}.error{margin-top:10px;color:var(--red-dark);font-size:14px}
.button{height:48px;padding:0 26px;border:0;border-radius:10px;background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 5px 14px rgba(179,15,42,.18);white-space:nowrap}.button:hover{background:var(--red-dark)}.button:disabled{opacity:.5;cursor:default}
.button.ghost{background:#fff;color:var(--red);border:1px solid var(--red);box-shadow:none}.button.ghost:hover{background:var(--soft-red)}
.button.small{height:38px;padding:0 16px;font-size:15px}
.result{margin-top:16px;padding:24px;min-height:128px}.result.empty{display:grid;place-items:center;color:var(--muted)}
.result h2{margin:0 0 5px;color:var(--red-dark);font-size:28px;line-height:1.25;font-weight:900}.route{margin:0;color:var(--muted)}
.badge{display:inline-block;margin-top:14px;padding:7px 17px;border-radius:999px;background:var(--soft-red);color:var(--red);font-weight:900;font-size:17px}.badge.call{background:#fff0df;color:#9a5a17}
.reverse{margin:8px 0 0;color:var(--muted);font-size:14px}.add-row{margin-top:16px}.add-msg{margin-top:8px;font-size:14px;color:var(--muted);min-height:21px}
.log{margin-top:16px;padding:22px 24px}.log h2,.nearby h2{margin:0;color:var(--red-dark);font-size:24px;font-weight:900}
.log-date{margin:2px 0 0;color:var(--muted);font-size:14px}
.log-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.sum-box{padding:12px;border-radius:12px;background:var(--soft)}.sum-box b{display:block;color:var(--red);font-size:30px;line-height:1.2}.sum-box span{color:var(--muted);font-size:14px}.sum-call{display:block;color:#9a5a17!important}
.log-list{display:grid;gap:8px;text-align:left}.log-item{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:2px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}.log-item .route,.log-item .km{white-space:nowrap}.log-item .mins,.log-item .del{justify-self:end}
.log-item .km{color:var(--muted);font-size:13px;font-weight:700}.log-item .mins{color:var(--red);font-weight:900;white-space:nowrap}.log-item .mins.call{color:#9a5a17}
.del{height:28px;padding:0 10px;border:1px solid #d4c7b8;border-radius:8px;background:#fff;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}.del:hover{color:var(--red);border-color:var(--red)}
.log-empty{color:var(--muted);font-size:16px;padding:6px;text-align:center}
.log-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.log-msg{margin-top:8px;font-size:14px;color:var(--muted);min-height:21px}
.duty{margin-top:14px;font-size:14px;color:var(--muted)}.duty button{border:0;background:none;color:var(--red);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.nearby{margin-top:16px;padding:22px 24px}.nearby-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left;margin-top:16px}
.nearby-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}.nearby-item .name{font-weight:800;white-space:nowrap}.nearby-item .code{color:var(--muted);font-size:13px;margin-left:4px}.nearby-item .distance{color:var(--red);font-weight:900;white-space:nowrap}
.nearby-empty{color:var(--muted);font-size:16px;padding:6px;grid-column:1/-1;text-align:center}
.modal{position:fixed;inset:0;background:rgba(41,37,33,.45);display:grid;place-items:center;padding:20px;z-index:10}.modal[hidden]{display:none}
.modal-box{width:100%;max-width:360px;padding:24px}.modal-box h3{margin:0 0 6px;color:var(--red-dark);font-size:22px}.modal-box p{margin:0 0 14px;color:var(--muted);font-size:14px}
.modal-box input{width:100%;height:52px;border:1px solid #d4c7b8;border-radius:10px;padding:0 12px;font:inherit;text-align:center;outline:none}.modal-box input:focus{border-color:var(--red);box-shadow:0 0 0 3px #ffe1e7}
.modal-box input+input{margin-top:10px}.modal-box input[hidden]{display:none}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.modal-err{min-height:21px;margin-top:8px;color:var(--red);font-size:14px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.wrap{padding:30px 16px 44px}.hero h1{font-size:30px}.calculator{padding:22px 18px}.form-grid{grid-template-columns:1fr;gap:6px}.swap{width:100%;height:40px;margin:0}.button{width:100%}.log-actions .button{width:auto;flex:1}.nearby-list{grid-template-columns:1fr}.result,.nearby,.log{padding:20px 16px}.log-item{padding:10px 11px;column-gap:8px}.log-item .route{font-size:15px}.log-item .km{font-size:12px}.del{padding:0 8px}.nearby h2,.log h2{font-size:20px;white-space:nowrap}}
</style></head><body><main class="wrap">
<header class="hero"><div class="brand" aria-label="KFC"><i></i>KFC 餐廳調撥</div><h1>調撥工時查詢</h1><p>機車導航距離｜公里數進位至 0.1 km</p></header>

<section class="card calculator" aria-labelledby="calc-title"><h2 id="calc-title" class="sr-only">輸入店號</h2>
<div class="form-grid">
<div class="field"><label for="from">起點店號</label><input id="from" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="例如 098"><div id="from-name" class="shop-name">&nbsp;</div></div>
<button class="swap" type="button" id="swap" aria-label="交換起點與終點">⇄</button>
<div class="field"><label for="to">終點店號</label><input id="to" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="例如 165"><div id="to-name" class="shop-name">&nbsp;</div></div>
</div>
<p class="hint">打店號數字即可，例如 098 或 TWI098</p>
</section>

<section id="result" class="card result empty" aria-live="polite">請輸入起點與終點店號。</section>


<section class="card nearby" aria-live="polite"><h2>1-5KM（30分鐘）</h2><div id="nearby-5" class="nearby-list"><div class="nearby-empty">尚未輸入起點店號</div></div></section>
<section class="card nearby" aria-live="polite"><h2>5-9KM（60分鐘）</h2><div id="nearby-9" class="nearby-list"><div class="nearby-empty">尚未輸入起點店號</div></div></section>
<section class="card log" aria-labelledby="log-title">
<h2 id="log-title">今日調撥紀錄</h2><p class="log-date" id="log-date"></p>
<div class="log-sum"><div class="sum-box"><b id="sum-count">—</b><span>筆數</span></div><div class="sum-box"><b id="sum-mins">—</b><span>合計工時（分鐘）</span><span id="sum-call" class="sum-call"></span></div></div>
<div id="log-list" class="log-list"><div class="log-empty">讀取中…</div></div>
<div class="log-actions"><button class="button ghost small" type="button" id="copy">複製今日匯總</button><button class="button ghost small" type="button" id="reload">重新整理</button></div>
<div id="log-msg" class="log-msg" aria-live="polite"></div>
<div class="duty" id="duty"></div>
</section>
</main>

<div class="modal" id="modal" hidden><div class="card modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
<h3 id="modal-title">值班登入</h3><p id="modal-desc"></p>
<input type="password" id="pw" autocomplete="current-password" placeholder="值班密碼">
<input type="password" id="pw-new" autocomplete="new-password" placeholder="新密碼（至少 4 個字）">
<input type="password" id="pw-new2" autocomplete="new-password" placeholder="再輸入一次新密碼">
<div class="modal-err" id="pw-err"></div>
<div class="modal-actions"><button class="button ghost" type="button" id="pw-cancel">取消</button><button class="button" type="button" id="pw-ok">登入</button></div>
</div></div>

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function displayKm(m){return Math.ceil(m/100)/10;}
function ruleFor(km){if(km<=5)return 30;if(km<=9)return 60;if(km<=13)return 90;if(km<=17)return 120;return null;}
function minsText(m){return m==null?'致電中心':m+' 分';}
function shortName(n){return n.replace(/餐廳$/,'');}
function findByCode(raw){
  const v=String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!v)return {state:'empty'};
  let hit=null;
  if(/^\d{1,3}$/.test(v)){const n=v.padStart(3,'0');hit=shops.find(s=>s.code.slice(3)===n);}
  else if(/^TW[A-Z]\d{3}$/.test(v)){hit=shops.find(s=>s.code===v);}
  return hit?{state:'ok',shop:hit}:{state:'bad'};
}
function showName(inputEl,nameEl,r){
  inputEl.classList.toggle('bad',r.state==='bad');
  nameEl.className='shop-name'+(r.state==='ok'?' ok':r.state==='bad'?' bad':'');
  nameEl.innerHTML=r.state==='ok'?esc(r.shop.shortName)+'（'+esc(r.shop.code)+'）':r.state==='bad'?'查無此店號':'&nbsp;';
}
function trip(a,b){const out=displayKm(DATA.distances[a.index][b.index]),back=displayKm(DATA.distances[b.index][a.index]);const basis=Math.max(out,back);return {out,back,basis,minutes:ruleFor(basis)};}

function renderNearby(shop,min,max,el){
  if(!shop){el.innerHTML='<div class="nearby-empty">尚未輸入起點店號</div>';return;}
  const items=shops.filter(s=>s.index!==shop.index).map(s=>({s,...trip(shop,s)})).filter(x=>x.basis>min&&x.basis<=max).sort((a,b)=>a.basis-b.basis);
  el.innerHTML=items.length?items.map(x=>'<div class="nearby-item"><span class="name">'+esc(shortName(x.s.shortName))+'<span class="code">'+esc(x.s.code.slice(3))+'</span></span><span class="distance">'+x.out.toFixed(1)+' / '+x.back.toFixed(1)+' km · '+x.minutes+'分</span></div>').join(''):'<div class="nearby-empty">目前沒有其他餐廳符合此雙向距離範圍。</div>';
}

function update(){
  const ra=findByCode($('from').value), rb=findByCode($('to').value);
  showName($('from'),$('from-name'),ra);showName($('to'),$('to-name'),rb);
  const a=ra.shop||null,b=rb.shop||null;
  renderNearby(a,0,5,$('nearby-5'));renderNearby(a,5,9,$('nearby-9'));
  const res=$('result');current=null;
  if(!a||!b){res.className='card result empty';res.textContent='請輸入起點與終點店號。';return;}
  if(a.index===b.index){res.className='card result empty';res.textContent='起點與終點不能是同一間餐廳。';return;}
  const t=trip(a,b);current={a,b,...t};
  res.className='card result';
  res.innerHTML='<h2>'+(t.minutes==null?'請致電中心溝通':'調撥工時：'+t.minutes+' 分鐘')+'</h2>'
   +'<p class="route">'+esc(a.shortName)+' → '+esc(b.shortName)+'</p>'
   +'<span class="badge'+(t.minutes==null?' call':'')+'">本方向：'+t.out.toFixed(1)+' km</span>'
   +'<p class="reverse">反向：'+t.back.toFixed(1)+' km</p>'
   +'<div class="add-row"><button class="button" type="button" id="add">加入今日紀錄</button><div class="add-msg" id="add-msg"></div></div>';
  $('add').addEventListener('click',addLog);
}

function taipeiToday(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());}
function taipeiTime(iso){return new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));}
function getPw(){try{return localStorage.getItem(PW_KEY)||'';}catch(e){return '';}}
function setPw(v){try{v?localStorage.setItem(PW_KEY,v):localStorage.removeItem(PW_KEY);}catch(e){}}
async function rpc(name,body){
  const r=await fetch(API_URL+name,{method:'POST',headers:{'apikey':API_KEY,'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const text=await r.text();let data=null;try{data=text?JSON.parse(text):null;}catch(e){}
  if(!r.ok){const msg=(data&&(data.message||data.hint))||text||('HTTP '+r.status);const err=new Error(msg);err.bad=/BAD_PASSWORD/.test(msg);err.missing=r.status===404;throw err;}
  return data;
}
function renderDuty(){
  let h;
  if(hasPw===false)h='尚未設定值班密碼　<button type="button" id="setup">設定密碼</button>';
  else if(getPw())h='值班已登入　<button type="button" id="change">更改密碼</button>　<button type="button" id="logout">登出</button>';
  else h='新增、刪除紀錄需值班登入　<button type="button" id="login">值班登入</button>';
  $('duty').innerHTML=h;
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn;};
  on('logout',()=>{setPw('');renderDuty();renderLogs();});
  on('login',()=>openModal(null,'login'));
  on('setup',()=>openModal(null,'setup'));
  on('change',()=>openModal(null,'change'));
}
async function loadHasPw(){try{hasPw=await rpc('t995_transfer_has_password',{});}catch(e){hasPw=null;}renderDuty();}

function renderLogs(){
  const total=logs.reduce((s,l)=>s+(l.minutes||0),0),calls=logs.filter(l=>l.minutes==null).length;
  $('sum-count').textContent=logs.length;
  $('sum-mins').textContent=total;$('sum-call').textContent=calls?'另 '+calls+' 筆致電中心':'';
  const canDel=!!getPw();
  $('log-list').innerHTML=logs.length?logs.map(l=>'<div class="log-item"><span class="route">'+esc(shortName(l.from_name))+' → '+esc(shortName(l.to_name))+'</span><span class="mins'+(l.minutes==null?' call':'')+'">'+minsText(l.minutes)+'</span><span class="km">'+taipeiTime(l.created_at)+'｜'+esc(l.from_code.slice(3))+' → '+esc(l.to_code.slice(3))+'｜'+Number(l.out_km).toFixed(1)+' / '+Number(l.back_km).toFixed(1)+' km</span>'+(canDel?'<button class="del" type="button" data-id="'+esc(l.id)+'">刪除</button>':'<span></span>')+'</div>').join(''):'<div class="log-empty">今天還沒有調撥紀錄</div>';
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>delLog(b.dataset.id));
}

const MODAL={
  login:{title:'值班登入',desc:'新增、刪除紀錄需要值班密碼。<br>這台裝置會記住，下次不用再輸入。',ok:'登入',old:true,nw:false},
  setup:{title:'設定值班密碼',desc:'第一次使用，請設定值班密碼。<br>之後新增、刪除紀錄都要用這組密碼。',ok:'設定',old:false,nw:true},
  change:{title:'更改值班密碼',desc:'請輸入目前的密碼和新密碼。<br>改完後其他裝置要重新登入。',ok:'更改',old:true,nw:true}
};
function openModal(action,mode){
  if(!mode)mode=hasPw===false?'setup':'login';
  pendingAction=action;modalMode=mode;const m=MODAL[mode];
  $('modal-title').textContent=m.title;$('modal-desc').innerHTML=m.desc;$('pw-ok').textContent=m.ok;
  $('pw').hidden=!m.old;$('pw').placeholder=mode==='change'?'目前的密碼':'值班密碼';
  $('pw-new').hidden=!m.nw;$('pw-new2').hidden=!m.nw;
  ['pw','pw-new','pw-new2'].forEach(id=>$(id).value='');$('pw-err').textContent='';
  $('modal').hidden=false;setTimeout(()=>$(m.old?'pw':'pw-new').focus(),30);
}
function closeModal(){$('modal').hidden=true;pendingAction=null;}
async function submitPw(){
  const mode=modalMode,m=MODAL[mode],v=$('pw').value.trim(),n1=$('pw-new').value.trim(),n2=$('pw-new2').value.trim();
  if(m.old&&!v){$('pw-err').textContent='請輸入密碼';return;}
  if(m.nw){if(n1.length<4){$('pw-err').textContent='新密碼至少 4 個字';return;}if(n1!==n2){$('pw-err').textContent='兩次輸入的新密碼不一樣';return;}}
  $('pw-ok').disabled=true;$('pw-err').textContent='確認中…';
  try{
    let finalPw=v;
    if(m.nw){await rpc('t995_transfer_set_password',{p_old:v||null,p_new:n1});finalPw=n1;hasPw=true;}
    else{const ok=await rpc('t995_transfer_check',{p_password:v});if(!ok){$('pw-err').textContent='密碼不正確';return;}}
    setPw(finalPw);const act=pendingAction;closeModal();renderDuty();renderLogs();
    $('log-msg').textContent=mode==='setup'?'值班密碼已設定':mode==='change'?'值班密碼已更改':'';
    if(act)act();
  }catch(e){$('pw-err').textContent=e.bad?(mode==='setup'?'密碼已有人設定，請改用值班登入':'目前的密碼不正確'):e.missing?'紀錄功能尚未啟用':'連線失敗，請稍後再試';if(e.bad&&mode==='setup'){hasPw=true;renderDuty();}}
  finally{$('pw-ok').disabled=false;}
}
async function addLog(){
  if(!current)return;const c=current,msg=$('add-msg');
  if(!getPw()){openModal(addLog);return;}
  $('add').disabled=true;msg.textContent='新增中…';
  try{await rpc('t995_transfer_add',{p_password:getPw(),p_from_code:c.a.code,p_from_name:c.a.shortName,p_to_code:c.b.code,p_to_name:c.b.shortName,p_out_km:c.out,p_back_km:c.back,p_minutes:c.minutes});
    msg.textContent='已加入：'+shortName(c.a.shortName)+' → '+shortName(c.b.shortName);await loadLogs();}
  catch(e){if(e.bad){setPw('');renderDuty();msg.textContent='值班密碼已變更，請重新登入';openModal(addLog,'login');}else msg.textContent=e.missing?'紀錄功能尚未啟用':'新增失敗，請稍後再試';}
  finally{const b=$('add');if(b)b.disabled=false;}
}
async function delLog(id){
  const l=logs.find(x=>x.id===id);if(!l)return;
  if(!confirm('確定刪除這筆紀錄？\n'+taipeiTime(l.created_at)+'　'+shortName(l.from_name)+' → '+shortName(l.to_name)))return;
  try{await rpc('t995_transfer_delete',{p_password:getPw(),p_id:id});$('log-msg').textContent='已刪除';await loadLogs();}
  catch(e){if(e.bad){setPw('');renderDuty();renderLogs();$('log-msg').textContent='值班密碼已變更，請重新登入';}else $('log-msg').textContent='刪除失敗，請稍後再試';}
}
function summaryText(){
  const d=taipeiToday().split('-');const total=logs.reduce((s,l)=>s+(l.minutes||0),0),calls=logs.filter(l=>l.minutes==null).length;
  const head=Number(d[1])+'/'+Number(d[2])+' 調撥匯總（共 '+logs.length+' 筆，合計 '+total+' 分鐘'+(calls?'，另 '+calls+' 筆致電中心':'')+'）';
  return [head].concat(logs.map((l,i)=>(i+1)+'. '+taipeiTime(l.created_at)+' '+shortName(l.from_name)+' → '+shortName(l.to_name)+'｜'+minsText(l.minutes))).join('\n');
}
async function copySummary(){
  if(!logs.length){$('log-msg').textContent='今天還沒有紀錄可以複製';return;}
  const t=summaryText();
  try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  $('log-msg').textContent='已複製，可以貼到 LINE';
}

$('from').addEventListener('input',update);$('to').addEventListener('input',update);
$('swap').addEventListener('click',()=>{const v=$('from').value;$('from').value=$('to').value;$('to').value=v;update();});
$('copy').addEventListener('click',copySummary);$('reload').addEventListener('click',loadLogs);
$('pw-ok').addEventListener('click',submitPw);$('pw-cancel').addEventListener('click',closeModal);
['pw','pw-new','pw-new2'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')submitPw();}));
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});
renderDuty();update();loadLogs();loadHasPw();
</script></body></html>
